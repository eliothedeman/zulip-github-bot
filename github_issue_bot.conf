[github_issue_bot]
# GitHub personal access token with repo scope
token=ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# Default repository in owner/repo format
default_repo=myorg/myrepo

# Optional: comma-separated list of repos users may target.
# If omitted, any repo the token can access is allowed.
# The default_repo is always implicitly included.
#allowed_repos=myorg/myrepo,myorg/frontend,myorg/backend
