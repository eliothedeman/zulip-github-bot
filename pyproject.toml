[project]
name = "zulip-github-bot"
version = "0.3.0"
description = "A Zulip bot that creates GitHub issues from chat messages"
requires-python = ">=3.10"
dependencies = [
    "PyGithub>=2.1.0",
]

[project.optional-dependencies]
# pip install '.[selfhost]' — long-running bot via zulip_bots
selfhost = ["zulip_bots"]
# pip install '.[webhook]' — Flask webhook server for cloud deployment
webhook = ["flask>=3.0", "gunicorn>=22.0"]
